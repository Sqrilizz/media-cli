name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: media-cli
            asset_name: media-cli-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: media-cli
            asset_name: media-cli-linux-x86_64-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: media-cli
            asset_name: media-cli-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: media-cli
            asset_name: media-cli-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: media-cli.exe
            asset_name: media-cli-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux and macOS)
        if: matrix.os != 'windows-latest'
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          body: |
            ## Installation

            ### Linux (x86_64)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/latest/download/media-cli-linux-x86_64 -o media-cli
            chmod +x media-cli
            sudo mv media-cli /usr/local/bin/
            ```

            ### Linux (musl - static binary)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/latest/download/media-cli-linux-x86_64-musl -o media-cli
            chmod +x media-cli
            sudo mv media-cli /usr/local/bin/
            ```

            ### macOS (Intel)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/latest/download/media-cli-macos-x86_64 -o media-cli
            chmod +x media-cli
            sudo mv media-cli /usr/local/bin/
            ```

            ### macOS (Apple Silicon)
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/latest/download/media-cli-macos-arm64 -o media-cli
            chmod +x media-cli
            sudo mv media-cli /usr/local/bin/
            ```

            ### Windows
            Download `media-cli-windows-x86_64.exe` and add to PATH.

            ## Dependencies
            - `mpv` or `vlc` - video player
            - `yt-dlp` - for YouTube
            - `streamlink` - for Twitch
            - `fzf` - for selection menu
            - `curl` - for API requests

            ## Quick Start
            ```bash
            # Interactive menu
            media-cli

            # YouTube
            media-cli yt "funny cats"

            # Music
            media-cli music "lofi hip hop"

            # Anime
            media-cli anime "naruto"

            # Twitch
            media-cli twitch shroud
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
