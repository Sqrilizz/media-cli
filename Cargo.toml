[package]
name = "media-cli"
version = "0.2.0"
edition = "2021"
authors = ["Sqrilizz <sqrilizz@users.noreply.github.com>"]
description = "Universal CLI media player for YouTube, Twitch, Anime and local files"
repository = "https://github.com/sqrilizz/media-cli"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
walkdir = "2.5"
crossterm = "0.27"
ratatui = "0.26"
rand = "0.8"
